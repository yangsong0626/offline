<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>周末不无聊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
html{color-scheme:light}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one calm column. Masthead, city bar, filters, then event cards ranked Chinese/Asian first. */
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --ink:#17211E; --muted:#5A6762; --line:#DCE2DD;
  --accent:#0D6A5A; --accent-ink:#FFFFFF; --a-bg:#E1F0EA; --b:#35569F; --b-bg:#E5ECF8;
  --chip:#EBEFEA; --sky1:#E5ECE8; --sky2:#D2E0D9; --focus:#1B7FD6; --shadow:0 1px 2px rgba(23,33,30,.05);
  --display:'Noto Serif SC','Songti SC',Georgia,serif;
  --body:'DM Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#162120; --ink:#E7EEEA; --muted:#93A29B; --line:#263431;
  --accent:#4DC2A6; --accent-ink:#06201A; --a-bg:#17352E; --b:#92ABE9; --b-bg:#1B2641;
  --chip:#1E2C29; --sky1:#15201E; --sky2:#1E2F2B; --focus:#6FB4F0; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#162120; --ink:#E7EEEA; --muted:#93A29B; --line:#263431;
  --accent:#4DC2A6; --accent-ink:#06201A; --a-bg:#17352E; --b:#92ABE9; --b-bg:#1B2641;
  --chip:#1E2C29; --sky1:#15201E; --sky2:#1E2F2B; --focus:#6FB4F0; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{overflow-x:clip;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:0 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:18px 8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-left:8px;text-transform:uppercase}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{white-space:nowrap;border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.masthead{position:relative;isolation:isolate;padding-bottom:clamp(96px,11vw,140px)}
.skyline{position:absolute;z-index:-1;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,1500px);pointer-events:none}
.skyline svg{display:block;width:100%;height:auto;animation:skyin .6s ease-out}
.skyline .far{fill:var(--sky1);stroke:var(--sky1)}
.skyline .near{fill:var(--sky2);stroke:var(--sky2)}
.skycap:empty{display:none}
.skycap{position:absolute;right:0;bottom:6px;font-size:11.5px;color:var(--muted);background:var(--bg);padding:1px 9px;border-radius:999px}
@keyframes skyin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{padding-block:20px 8px;display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.sub{color:var(--muted);margin:0}

.citybar{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow)}
.finder{display:flex;gap:8px;flex-wrap:wrap}
.finder input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.finder input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted);margin:0;min-height:1.4em}
.cities{display:flex;flex-wrap:wrap;gap:6px}
.city{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.city[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.weekend{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:26px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.weekend h2{font-family:var(--display);font-size:22px;margin:0}
.wx{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.wx span{display:inline-flex;gap:6px;align-items:center}
.wx svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.aud{margin-top:14px}
.badge.aud{background:var(--chip);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters .gap{flex:1}
.count{font-size:13px;color:var(--muted);margin:14px 0 0}

.list{display:grid;gap:12px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 16px;box-shadow:var(--shadow)}
.when{display:grid;align-content:start;gap:2px;font-variant-numeric:tabular-nums}
.when .d{font-family:var(--display);font-weight:700;font-size:24px;line-height:1}
.when .w{font-size:12px;color:var(--muted);letter-spacing:.04em}
.when .t{font-size:13px;margin-top:6px;font-weight:500}
.body{min-width:0;display:grid;gap:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.badge.A{background:var(--a-bg);color:var(--accent)}
.badge.B{background:var(--b-bg);color:var(--b)}
h3{margin:0;font-size:18px;line-height:1.3;font-weight:600;text-wrap:balance}
.where{font-size:14px;color:var(--muted);margin:0}
.where a{text-underline-offset:3px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px}
.meta .free{background:var(--a-bg);color:var(--accent);font-weight:600}
.desc{margin:0;font-size:14.5px;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;align-items:center}
details.cal{position:relative}
details.cal summary{list-style:none;cursor:pointer}
details.cal summary::-webkit-details-marker{display:none}
.menu{position:absolute;z-index:5;left:0;top:calc(100% + 6px);min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.menu a,.menu button{display:block;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px}
.menu a:hover,.menu button:hover{background:var(--chip)}
.link{font-size:14px;color:var(--muted)}

.empty{padding:32px 8px;text-align:center;color:var(--muted)}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:480px){
  .brand small{display:block;margin:2px 0 0}
  .card{grid-template-columns:1fr}
  .when{grid-template-columns:auto auto 1fr;align-items:baseline;gap:8px}
  .when .t{margin:0;justify-self:end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body>
<div class="wrap">
 <div class="masthead">
  <div class="skyline" id="skyline" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">周末不无聊<small>No Boring Weekends</small></div>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-zh" type="button" aria-pressed="true">中文</button>
      <button id="lang-en" type="button" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
  </section>
  <p class="skycap" id="skycap"></p>
 </div>

  <section class="citybar" aria-label="City">
    <form class="finder" id="finder">
      <input id="addr" type="text" inputmode="text" autocomplete="postal-code" aria-label="Address or ZIP">
      <button class="btn primary" type="submit" id="go"></button>
    </form>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="cities" id="cities"></div>
  </section>

  <section class="weekend">
    <h2 id="weekend-title"></h2>
    <div class="wx" id="wx"></div>
  </section>

  <div class="seg aud" id="aud" role="group" aria-label="Audience"></div>
  <div class="filters" id="filters"></div>
  <p class="count" id="count"></p>
  <div class="list" id="list"></div>

  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>

  return '<article class="card" data-id="'+esc(e.id)+'">'+
   '<div class="when"><span class="d">'+(S.lang==="zh"?p.m+"/"+p.d:p.d)+'</span><span class="w">'+esc(S.lang==="zh"?wd:wd+" · "+dateLabel(e.date).split(" ")[0])+'</span>'+
   '<span class="t">'+esc(timeLabel(e.start))+(e.end?'<br>'+esc(timeLabel(e.end)):'')+'</span></div>'+
   '<div class="body">'+(badge?'<div class="badges">'+badge+'</div>':'')+
   '<h3>'+esc(x.title)+'</h3>'+
   '<p class="where">'+esc(e.venue)+' · <a href="'+map+'" target="_blank" rel="noopener">'+esc(e.address)+'</a></p>'+
   '<div class="meta">'+meta.join("")+'</div>'+
   '<p class="desc">'+esc(x.desc)+'</p>'+
   '<div class="actions">'+
    '<details class="cal"><summary class="btn primary">'+esc(t("addCal"))+'</summary><div class="menu">'+
     '<a href="'+esc(gcalUrl(e,tz))+'" target="_blank" rel="noopener">'+esc(t("gcal"))+'</a>'+
     '<a href="'+esc(outlookUrl(e,tz))+'" target="_blank" rel="noopener">'+esc(t("outlook"))+'</a>'+
     '<button type="button" data-ics="'+esc(e.id)+'">'+esc(t("ics"))+'</button>'+
     '<button type="button" data-copy="'+esc(e.id)+'">'+esc(t("copy"))+'</button></div></details>'+
    '<a class="link" href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(t("site"))+' ↗</a>'+
   '</div></div></article>'
}
var NARROW=window.matchMedia?matchMedia("(max-width:600px)"):{matches:false};
function drawSky(){
  var s=SKY[S.city],key=S.city+(NARROW.matches?"n":"w");
  $("skycap").textContent=s?"📍 "+(S.lang==="zh"?s.zh:s.en):"";$("skycap").hidden=!s;
  if(S.skyKey===key)return;S.skyKey=key;
  if(!s){$("skyline").innerHTML="";return}
  var w=NARROW.matches?700:1200,x=NARROW.matches?Math.max(0,Math.min(1200-w,s.fx-w/2)):0;
  $("skyline").innerHTML='<svg viewBox="'+x+' 0 '+w+' 220" preserveAspectRatio="xMidYMax meet"><g class="far">'+s.far+'</g><g class="near">'+s.near+'</g></svg>'
}
if(NARROW.addEventListener)NARROW.addEventListener("change",function(){if(S.data)drawSky()});
function render(){
  document.documentElement.lang=S.lang==="zh"?"zh-CN":"en";
  $("lang-zh").setAttribute("aria-pressed",S.lang==="zh");$("lang-en").setAttribute("aria-pressed",S.lang==="en");
  $("eyebrow").textContent=t("eyebrow");$("headline").textContent=t("headline");$("sub").textContent=t("sub");
  $("addr").placeholder=t("addrPh");$("go").textContent=t("go");
  if(!S.data){return}
  drawSky();
  var cs=S.data.cities,c=cs[S.city];
  var h=S.hint;$("hint").textContent=h[0]==="none"?fmt(t("hintNone"),{n:Object.keys(cs).length}):fmt(t(h[0]==="tz"?"hintTz":h[0]==="saved"?"hintSaved":"hintFound"),{c:cityName(S.city)});
  $("cities").innerHTML=Object.keys(cs).map(function(id){return '<button type="button" class="city" data-city="'+id+'" aria-pressed="'+(id===S.city)+'">'+esc(S.lang==="zh"?cs[id].zh:cs[id].en)+'</button>'}).join("");
  var wk=S.data.weekend;
  $("weekend-title").textContent=cityName(S.city)+" · "+fmt(t("weekend"),{s:dateLabel(wk.start),e:dateLabel(wk.end)});
  $("wx").innerHTML=wxHtml(c);
  var days=[["all",t("all")],["fri",t("fri")],["sat",t("sat")],["sun",t("sun")]];
  $("filters").innerHTML=days.map(function(d){return '<button type="button" class="chip" data-day="'+d[0]+'" aria-pressed="'+(S.day===d[0])+'">'+esc(d[1])+'</button>'}).join("")+'<span class="gap"></span>'+
   [["asian",t("asian")],["free",t("free")],["indoor",t("indoor")]].map(function(f){return '<button type="button" class="chip" data-flag="'+f[0]+'" aria-pressed="'+S[f[0]]+'">'+esc(f[1])+'</button>'}).join("");
  $("aud").innerHTML=[["all","audAll"],["family","audFamily"],["adult","audAdult"]].map(function(a){return '<button type="button" data-aud="'+a[0]+'" aria-pressed="'+(S.aud===a[0])+'">'+esc(t(a[1]))+'</button>'}).join("");
  var all=c.events,base=all.filter(forAud),as=base.filter(function(e){return e.tier!=="C"}).length,list=visible(c);
  $("count").textContent=base.length?fmt(t("count"),{n:base.length,a:as}):"";
  $("list").innerHTML=list.length?list.map(function(e){return card(e,c.tz)}).join(""):all.length?'<p class="empty">'+esc(t("empty"))+'</p>':'<p class="empty">'+esc(t("comingSoon"))+'</p>';
  $("foot").innerHTML='<span>'+esc(fmt(t("foot1"),{u:S.data.updated}))+'</span><span>'+esc(t("foot2"))+'</span>'
}
function toast(msg){var el=$("toast");el.textContent=msg;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove("on")},2400)}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-city],[data-aud],[data-day],[data-flag],[data-copy],[data-ics]"),open=document.querySelectorAll("details.cal[open]");
  if(!ev.target.closest("details.cal"))open.forEach(function(d){d.removeAttribute("open")});
  else open.forEach(function(d){if(!d.contains(ev.target))d.removeAttribute("open")});
  if(!b)return;
  if(b.dataset.city){setCity(b.dataset.city,["found"])}
  else if(b.dataset.aud){S.aud=b.dataset.aud;store("kids.aud",S.aud);render()}
  else if(b.dataset.day){S.day=b.dataset.day;render()}
  else if(b.dataset.flag){S[b.dataset.flag]=!S[b.dataset.flag];render()}
  else if(b.dataset.ics){
    var e2=S.data.cities[S.city].events.filter(function(x){return x.id===b.dataset.ics})[0];
    var blob=new Blob([icsText(e2,S.data.cities[S.city].tz)],{type:"text/calendar;charset=utf-8"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=e2.id+".ics";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},2000);b.closest("details").removeAttribute("open")}
  else if(b.dataset.copy){
    var e=S.data.cities[S.city].events.filter(function(x){return x.id===b.dataset.copy})[0],txt=plainText(e);
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast(t("copied"))},function(){toast(t("copyFail"))});
    b.closest("details").removeAttribute("open")
  }
});
$("lang-zh").onclick=function(){S.lang="zh";store("kids.lang","zh");render()};
$("lang-en").onclick=function(){S.lang="en";store("kids.lang","en");render()};
$("finder").addEventListener("submit",function(ev){ev.preventDefault();
  var id=resolveCity($("addr").value);
  if(id)setCity(id,["found"]);else{S.hint=["none"];render()}
});

/* ---------- boot ---------- */
var saved=store("kids.lang"),sa=store("kids.aud");if(sa==="family"||sa==="adult")S.aud=sa;
S.lang=saved==="en"||saved==="zh"?saved:((navigator.language||"").toLowerCase().indexOf("zh")===0?"zh":"en");
render();
fetch("events.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  S.data=d;
  var sc=store("kids.city"),tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
  if(sc&&d.cities[sc]){S.city=sc;S.hint=["saved"]}
  else{S.city=TZ_DEFAULT[tz]||"nyc";S.hint=["tz"]}
  render()
}).catch(function(){$("list").innerHTML='<p class="empty">'+esc(t("eventsFail"))+'</p>'});
})();
</script>

</body></html>
